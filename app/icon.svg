<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    .panda-line { 
      stroke: #d34027; 
      fill: none; 
      stroke-width: 1.8; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
    @media (prefers-color-scheme: dark) {
      .panda-line { 
        stroke: #ffffff; 
      }
    }
  </style>
  <!-- Outline car body (matches logo's boxy silhouette) -->
  <path class="panda-line" d="M 4,20 C 4,16 6,14 10,13 L 22,13 C 26,13 28,15 28,18 L 28,21" />
  <path class="panda-line" d="M 28,24 L 25,24 M 18,24 L 14,24 M 7,24 L 4,24" />
  <!-- Bottom connection -->
  <path class="panda-line" d="M 4,21 L 4,24" />
  <!-- Simple Wheel Circles -->
  <circle class="panda-line" cx="10.5" cy="24" r="2.5" />
  <circle class="panda-line" cx="21.5" cy="24" r="2.5" />
</svg>
