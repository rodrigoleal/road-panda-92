#cloud-config

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - git
  - curl

write_files:
  - path: /root/docker-compose.yml
    content: |
      version: '3.8'

      services:
        db:
          image: mysql:8.0
          container_name: mysql
          restart: always
          environment:
            MYSQL_ROOT_PASSWORD: roadpanda_root_secret
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: roadpanda_wp_secret
          volumes:
            - db_data:/var/lib/mysql
          command: --default-authentication-plugin=mysql_native_password --max_connections=50 --innodb_buffer_pool_size=64M

        wordpress:
          image: wordpress:php8.2-fpm-alpine
          container_name: wordpress
          restart: always
          depends_on:
            - db
            - redis
          environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: roadpanda_wp_secret
            WORDPRESS_DB_NAME: wordpress
          volumes:
            - wp_data:/var/www/html

        webserver:
          image: nginx:alpine
          container_name: webserver
          restart: always
          ports:
            - "80:80"
          depends_on:
            - wordpress
          volumes:
            - wp_data:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf

        redis:
          image: redis:alpine
          container_name: redis
          restart: always

      volumes:
        db_data:
        wp_data:

  - path: /root/nginx.conf
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html;
          index index.php;

          location / {
              try_files $uri $uri/ /index.php?$args;
          }

          location ~ \.php$ {
              fastcgi_pass wordpress:9000;
              fastcgi_index index.php;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_param PATH_INFO $fastcgi_path_info;
          }
      }

runcmd:
  # 1. Setup Swap (2GB) - Critical for e2-micro
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  
  # 2. Configure Sysctl for Redis and MySQL low memory
  - sysctl vm.swappiness=10
  - echo "vm.swappiness=10" >> /etc/sysctl.conf

  # 3. Start Docker Services
  - cd /root
  - docker-compose up -d

final_message: "Road Panda 92 Infrastructure Ready! IP: $INSTANCE_IP. WP Credentials in docker-compose.yml"
