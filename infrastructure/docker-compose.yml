version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: roadpanda_root_secret
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: roadpanda_wp_secret
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --max_connections=50 --innodb_buffer_pool_size=64M

  wordpress:
    image: wordpress:php8.2-fpm-alpine
    container_name: wordpress
    restart: always
    depends_on:
      - db
      - redis
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: roadpanda_wp_secret
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

  webserver:
    image: nginx:alpine
    container_name: webserver
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  redis:
    image: redis:alpine
    container_name: redis
    restart: always

volumes:
  db_data:
  wp_data:
